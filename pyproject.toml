[project]
name = "bioinformatics-realtime-protein"
version = "0.1.0"
description = "Minimal skeleton for a realtime protein function prediction platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cassandra-driver>=3.29.0",
    "fastapi>=0.115.0",
    "kafka-python>=2.0.2",
    "pika>=1.3.2",
    "pydantic>=2.8.0",
    "requests>=2.32.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
spark = [
    "pyspark==3.5.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "contracts*", "jobs*", "libs*", "ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
