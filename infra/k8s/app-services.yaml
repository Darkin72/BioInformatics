apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 5173
      targetPort: 5173
      nodePort: 30174
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      initContainers:
        - name: wait-for-serving-api
          image: bioinformatics/backend:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-c"]
          args:
            - |
              import socket, time
              deadline = time.time() + 600
              while True:
                  try:
                      socket.create_connection(("serving-api", 8000), timeout=3).close()
                      print("serving-api:8000 is reachable", flush=True)
                      break
                  except OSError:
                      if time.time() > deadline:
                          raise
                      print("Waiting for serving-api:8000...", flush=True)
                      time.sleep(5)
      containers:
        - name: frontend
          image: bioinformatics/frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
              name: http
          envFrom:
            - configMapRef:
                name: bioinformatics-config
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
