name: ${COMPOSE_PROJECT_NAME:-bioinformatics}

services:
  serving-api:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: bioinformatics-serving-api
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      JWT_SECRET: ${JWT_SECRET:-dev-local-change-before-shipping}
      JWT_EXPIRES_SECONDS: ${JWT_EXPIRES_SECONDS:-3600}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://protein:protein@rabbitmq:5672/}
      CASSANDRA_HOST: ${CASSANDRA_HOST:-cassandra}
      CASSANDRA_PORT: ${CASSANDRA_PORT:-9042}
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-protein_rt}
      DATABASE_URL: ${DATABASE_URL:-postgresql://protein:protein@postgres:5432/protein_metadata}
      CAFA6_HEALTH_URL: ${CAFA6_HEALTH_URL:-}
      CAFA6_PREDICT_URL: ${CAFA6_PREDICT_URL:-}
      CAFA6_TOP_K: ${CAFA6_TOP_K:-20}
      CAFA6_TIMEOUT_SECONDS: ${CAFA6_TIMEOUT_SECONDS:-60}
      USER_STORE_PATH: ${USER_STORE_PATH:-tmp/auth_users.json}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - ./apps:/app/apps
      - ./docs:/app/docs:ro
      - ./tmp:/app/tmp
    depends_on:
      postgres:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: bioinformatics-notification-service
    command:
      - uvicorn
      - apps.notification_service.src.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8003"
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_REQUEST_STATUS_TOPIC: ${KAFKA_REQUEST_STATUS_TOPIC:-request_status}
      KAFKA_PREDICTION_TOPIC: ${KAFKA_PREDICTION_TOPIC:-prediction_result}
      KAFKA_DEAD_LETTER_TOPIC: ${KAFKA_DEAD_LETTER_TOPIC:-dead_letter}
      CASSANDRA_HOST: ${CASSANDRA_HOST:-cassandra}
      CASSANDRA_PORT: ${CASSANDRA_PORT:-9042}
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-protein_rt}
    ports:
      - "${NOTIFICATION_HOST_PORT:-8003}:8003"
    depends_on:
      cassandra:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: bioinformatics-frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_EVENTS_BASE_URL: ${VITE_EVENTS_BASE_URL:-http://localhost:8003}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      serving-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.2.0
    container_name: bioinformatics-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.2.0
    container_name: bioinformatics-kafka-init
    profiles: ["init"]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./docker/kafka/create-topics.sh:/opt/bitnami/scripts/create-topics.sh:ro
    command: ["bash", "/opt/bitnami/scripts/create-topics.sh"]
    restart: "no"

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: bioinformatics-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-protein}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-protein}
    ports:
      - "${RABBITMQ_AMQP_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: bioinformatics-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-protein_metadata}
      POSTGRES_USER: ${POSTGRES_USER:-protein}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-protein}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-protein} -d ${POSTGRES_DB:-protein_metadata}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  cassandra:
    image: cassandra:5.0
    container_name: bioinformatics-cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: BioinformaticsLocal
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 768M
      HEAP_NEWSIZE: 192M
    ports:
      - "${CASSANDRA_HOST_PORT:-9042}:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 18
      start_period: 60s
    restart: unless-stopped

  cassandra-init:
    image: cassandra:5.0
    container_name: bioinformatics-cassandra-init
    profiles: ["init"]
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./infra/cassandra/schema.cql:/schema.cql:ro
      - ./docker/cassandra/init-schema.sh:/init-schema.sh:ro
    command: ["bash", "/init-schema.sh"]
    restart: "no"

  spark-master:
    image: spark:3.5.8-python3
    container_name: bioinformatics-spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "${SPARK_MASTER_WEB_HOST_PORT:-8080}:8080"
      - "${SPARK_MASTER_HOST_PORT:-7077}:7077"
    volumes:
      - ./jobs:/opt/bitnami/spark/jobs:ro
      - ./ml:/opt/bitnami/spark/ml:ro
    restart: unless-stopped

  spark-worker:
    image: spark:3.5.8-python3
    container_name: bioinformatics-spark-worker
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - ${SPARK_MASTER_URL:-spark://spark-master:7077}
      - --cores
      - "1"
      - --memory
      - 1G
      - --webui-port
      - "8081"
    ports:
      - "${SPARK_WORKER_WEB_HOST_PORT:-8081}:8081"
    depends_on:
      - spark-master
    volumes:
      - ./jobs:/opt/bitnami/spark/jobs:ro
      - ./ml:/opt/bitnami/spark/ml:ro
    restart: unless-stopped

volumes:
  kafka_data:
  rabbitmq_data:
  postgres_data:
  cassandra_data:
  frontend_node_modules:
