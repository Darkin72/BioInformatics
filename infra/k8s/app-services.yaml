apiVersion: v1
kind: Service
metadata:
  name: serving-api
spec:
  type: NodePort
  selector:
    app: serving-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: serving-api
  template:
    metadata:
      labels:
        app: serving-api
    spec:
      initContainers:
        - name: wait-for-deps
          image: bioinformatics/backend:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-c"]
          args:
            - |
              import socket, time
              targets = [("postgres", 5432), ("cassandra", 9042), ("kafka", 9092), ("rabbitmq", 5672)]
              deadline = time.time() + 600
              for host, port in targets:
                  while True:
                      try:
                          socket.create_connection((host, port), timeout=3).close()
                          print(f"{host}:{port} is reachable", flush=True)
                          break
                      except OSError:
                          if time.time() > deadline:
                              raise
                          print(f"Waiting for {host}:{port}...", flush=True)
                          time.sleep(5)
      containers:
        - name: serving-api
          image: bioinformatics/backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: bioinformatics-config
            - secretRef:
                name: bioinformatics-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: app-tmp
              mountPath: /app/tmp
      volumes:
        - name: app-tmp
          emptyDir: {}
---
